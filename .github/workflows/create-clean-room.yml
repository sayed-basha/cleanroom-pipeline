name: create-clean-room

on:
  workflow_dispatch:
    inputs:
      clean_room_name:
        description: 'Unique name for this clean room (letters/numbers/underscores only)'
        required: true
        type: string
      project_id:
        description: 'GCP project this clean room lives in (leave blank to use default)'
        required: false
        default: ""
        type: string
      dataset_id:
        description: 'BigQuery dataset to share'
        required: true
        type: string
      source_table:
        description: 'Table within that dataset to share'
        required: true
        type: string
      privacy_unit_col:
        description: 'Column identifying one entity, e.g. patient_id'
        required: true
        type: string
      aggregation_threshold:
        description: 'Minimum distinct entity count required to release a result row'
        required: true
        default: "50"
        type: string
      allow_query_result_export:
        description: 'Let subscribers save/export their query results? (unchecked = safer, results stay view-only)'
        required: false
        type: boolean
        default: false
      columns:
        description: 'Comma-separated list of columns to publish (leave blank = use all columns)'
        required: false
        default: ""
        type: string
      publisher_principal:
        description: 'Email address (e.g. alice@company.com) — or group:name@company.com / serviceAccount:name@project.iam.gserviceaccount.com if needed'
        required: false
        default: ""
        type: string
      subscriber_principal:
        description: 'Email address (e.g. bob@partner.com) — or group:name@partner.com if needed'
        required: false
        default: ""
        type: string

# Serialize runs that target the same clean room, so two people triggering
# this workflow around the same time for the same clean_room_name don't race
# on the IAM policy read-modify-write in grant_iam().
# Different clean_room_name values still run fully in parallel.
# cancel-in-progress: false means the second run WAITS its turn instead of
# killing the first one mid-grant.
concurrency:
  group: clean-room-${{ github.event.inputs.clean_room_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  create-clean-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Create or update clean room
        run: |
          python scripts/manage_clean_room.py \
            --clean-room-name "${{ github.event.inputs.clean_room_name }}" \
            --project-id "${{ github.event.inputs.project_id || vars.GCP_PROJECT_ID }}" \
            --location "${{ vars.DEFAULT_LOCATION }}" \
            --dataset-id "${{ github.event.inputs.dataset_id }}" \
            --source-table "${{ github.event.inputs.source_table }}" \
            --privacy-unit-col "${{ github.event.inputs.privacy_unit_col }}" \
            --threshold "${{ github.event.inputs.aggregation_threshold }}" \
            --columns "${{ github.event.inputs.columns }}" \
            --publishers "${{ github.event.inputs.publisher_principal }}" \
            --subscribers "${{ github.event.inputs.subscriber_principal }}" \
            ${{ github.event.inputs.allow_query_result_export == 'true' && '--allow-query-result-export' || '' }}